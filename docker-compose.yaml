services:
  nginx:
    image: nginx:mainline-alpine3.23
    container_name: nginx
    hostname: nginx
    networks:
      - nginx_network
    deploy:
      resources:
        limits:
          memory: 100m
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 10s

networks:
  nginx_network:
    external: true
